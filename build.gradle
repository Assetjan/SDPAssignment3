plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-logging:commons-logging:1.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) 
    }
}

application {
    mainClass = 'com.example.adapter.Main'
}
